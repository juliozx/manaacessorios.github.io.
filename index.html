<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mana Semijoias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style id="css">
/* Layout: vitrine estreita com cabeçalho fixo e carrinho em gaveta; painel do administrador em tela cheia por cima da vitrine. */
:root {
  --bg: #f8f0ea;
  --surface: #ffffff;
  --ink: #3b2b2a;
  --muted: #7a645f;
  --line: #ecdcd2;
  --soft: #f5e6dd;
  --accent: #b4586a;
  --accent-ink: #ffffff;
  --accent-soft: #e9bcc0;
  --wa: #178441;
  --wa-ink: #ffffff;
  --wa-text: #0f6a35;
  --promo: #a8442f;
  --promo-soft: #fbe6dc;
  --danger: #b42318;
  --velvet-a: #e6bab4;
  --velvet-b: #cf9a99;
  --gold: #d9a441;
  --shadow: 0 10px 30px rgba(110, 60, 50, .14);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; }

/* Cabeçalho */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-bottom: 2px solid var(--accent-soft);
}
.brand { display: flex; align-items: center; gap: 14px; padding-block: 12px; max-width: 1040px; margin: 0 auto; }
.logo {
  width: 52px; height: 52px; border-radius: 50%; flex: none; overflow: hidden;
  background: radial-gradient(circle at 30% 25%, var(--accent-soft), var(--accent));
  display: grid; place-items: center; color: var(--accent-ink);
  font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .02em;
}
.logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.brand h1 { margin: 0; font: 700 21px/1.15 var(--font-display); text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.hbtns { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.theme-btn, .adm-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.theme-btn { width: 38px; }
.adm-btn { padding: 0 14px; font-weight: 600; font-size: 13.5px; }
.ig-btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 999px; height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13.5px; text-decoration: none; }
.ig-btn svg { width: 17px; height: 17px; }
@media (max-width: 420px) { .ig-btn span { display: none; } .ig-btn { padding: 0; width: 38px; justify-content: center; } }
.theme-btn svg, .adm-btn svg { width: 17px; height: 17px; }

/* Anúncios */
.anns { max-width: 1040px; margin: 12px auto 0; display: flex; flex-direction: column; gap: 8px; }
.ann { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); }
.ann.promocao { border-left-color: var(--promo); }
.ann.novidade { border-left-color: var(--gold); }
.ann .chipt { flex: none; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); padding-top: 2px; }
.ann.promocao .chipt { color: var(--promo); }
.ann.novidade .chipt { color: var(--muted); }
.ann .txt { min-width: 0; flex: 1; overflow-wrap: anywhere; }
.ann b { font-weight: 600; }
.ann .aimg { margin-top: 8px; border-radius: 10px; overflow: hidden; background: var(--soft); }
.ann .aimg img { display: block; width: 100%; height: auto; max-height: 320px; object-fit: cover; }
.ann .alink { display: inline-block; margin-top: 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); padding: 8px 16px; font-weight: 600; font-size: 13.5px; text-decoration: none; }

.banner {
  max-width: 1040px; margin: 14px auto 0; border-radius: 16px; overflow: hidden;
  background: linear-gradient(120deg, var(--soft), var(--accent-soft));
  padding: 18px 20px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; justify-content: space-between;
}
.banner strong { font: 700 18px/1.2 var(--font-display); }
.banner ul { margin: 0; padding: 0; list-style: none; display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
.banner li::before { content: "•"; color: var(--accent); margin-right: 6px; }

/* Categorias e ferramentas */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 6px; scrollbar-width: thin; }
.chip { flex: none; border-radius: 999px; padding: 8px 15px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tools { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; padding-block: 10px 4px; }
.search { flex: 1 1 260px; position: relative; min-width: 0; }
.search svg { position: absolute; left: 13px; top: 50%; translate: 0 -50%; width: 17px; height: 17px; color: var(--muted); }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 11px 16px 11px 38px; }
.search input::placeholder { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; width: 100%; justify-content: space-between; color: var(--muted); font-size: 13.5px; padding-block: 6px 14px; }
.meta .right { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 36px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: translate .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { translate: 16px 0; }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; }

/* Grade */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.photo { aspect-ratio: 4 / 5; background: var(--soft); position: relative; max-width: 100%; }
.photo svg, .photo img { width: 100%; height: 100%; display: block; object-fit: cover; }
.tag { position: absolute; top: 10px; left: 10px; background: var(--promo-soft); color: var(--promo); font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.tag.out { left: auto; right: 10px; background: var(--ink); color: var(--bg); }
.info { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.info h3 { margin: 0; font: 600 14.5px/1.3 var(--font-body); min-height: 2.6em; text-wrap: balance; overflow-wrap: anywhere; }
.stock { font-size: 12.5px; color: var(--muted); }
.price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 4px; font-variant-numeric: tabular-nums; }
.price b { font: 700 19px/1 var(--font-display); }
.price s { color: var(--muted); font-size: 13px; }
.add { margin-top: 8px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); padding: 11px 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.add:hover { filter: brightness(1.06); }
.add:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.add svg { width: 17px; height: 17px; }
.empty { grid-column: 1 / -1; text-align: center; padding: 48px 12px; color: var(--muted); }
footer a { color: var(--accent); font-weight: 600; }
footer p { margin: 0 0 6px; }
footer { max-width: 1040px; margin: 36px auto 0; color: var(--muted); font-size: 12.5px; text-align: center; text-wrap: balance; }

.fab { position: fixed; z-index: 35; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); padding: 13px 20px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); font-weight: 600; }
.fab svg { width: 19px; height: 19px; }
.fab .count { background: var(--accent); color: var(--accent-ink); min-width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; font-size: 12.5px; padding-inline: 6px; }
.fab .sum { font-variant-numeric: tabular-nums; }

/* Gaveta do carrinho */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(20, 8, 14, .5); }
.drawer { position: fixed; z-index: 51; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 88dvh; left: 0; right: 0; bottom: 0; border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 720px) { .drawer { left: auto; top: 0; bottom: 0; width: 420px; max-height: none; border-radius: 20px 0 0 20px; padding-top: env(safe-area-inset-top, 0px); } }
.dhead { display: flex; align-items: center; gap: 10px; padding: 18px max(18px, env(safe-area-inset-left, 0px)) 14px 18px; border-bottom: 1px solid var(--line); }
.dhead h2 { margin: 0; font: 700 18px var(--font-display); }
.dhead .n { background: var(--accent-soft); color: var(--ink); border-radius: 999px; font-size: 12px; font-weight: 600; padding: 2px 9px; }
.dhead .sp { flex: 1; }
.link { border: 0; background: none; color: var(--danger); display: inline-flex; gap: 6px; align-items: center; padding: 6px 8px; font-size: 14px; }
.x { border: 0; background: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.x svg, .link svg { width: 18px; height: 18px; }
.link.armed { font-weight: 700; text-decoration: underline; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.items { overflow-y: auto; padding: 8px 18px; flex: 1; min-height: 80px; }
.line { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.line .thumb { width: 64px; height: 76px; border-radius: 10px; overflow: hidden; background: var(--soft); }
.line .thumb svg, .line .thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
.line h4 { margin: 0; font: 600 14px/1.3 var(--font-body); overflow-wrap: anywhere; }
.line .u { color: var(--accent); font-size: 13px; font-variant-numeric: tabular-nums; }
.qty { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; }
.qty button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 17px; line-height: 1; }
.qty span { min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.line .sub { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.cart-empty { text-align: center; color: var(--muted); padding: 36px 8px; }
.dfoot { padding: 14px 18px 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 0; }
.coupon { display: flex; gap: 8px; }
.coupon input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; text-transform: uppercase; letter-spacing: .04em; }
.coupon button { border: 0; background: var(--soft); color: var(--ink); border-radius: 12px; padding: 0 16px; font-weight: 600; }
.cmsg { font-size: 12.5px; min-height: 1.2em; color: var(--muted); }
.cmsg.ok { color: var(--wa); }
.cmsg.bad { color: var(--promo); }
.totals { display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; }
.totals .row { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
.totals .tot { color: var(--ink); align-items: baseline; }
.totals .tot b { font: 700 24px var(--font-display); color: var(--accent); }
.wa { border: 0; border-radius: 14px; background: var(--wa); color: var(--wa-ink); padding: 14px; font-weight: 700; font-size: 16px; display: flex; gap: 10px; align-items: center; justify-content: center; text-decoration: none; }
.wa[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.wa svg { width: 20px; height: 20px; }
.hint { text-align: center; color: var(--muted); font-size: 12.5px; margin: 0; }
.copy { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 12px; font-weight: 600; display: flex; gap: 8px; align-items: center; justify-content: center; }
.copy svg { width: 17px; height: 17px; }
.fallback { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 10px; font-size: 13px; }
.entrega { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; margin: 0; min-width: 0; }
.entrega legend { font-weight: 600; font-size: 14px; padding: 0 6px; }
.entrega .hint { text-align: left; margin: 0 0 6px; }
.egrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.efld { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.efld.wide { grid-column: 1 / -1; }
.efld input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 10px; color: var(--ink); font-size: 16px; }
.efld input[aria-invalid="true"] { border-color: var(--danger); }

/* Aviso de rascunho e avisos rápidos */
.draftbar { position: fixed; z-index: 45; left: 50%; translate: -50% 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 9px 10px 9px 16px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); font-size: 13.5px; max-width: calc(100% - 140px); }
.draftbar button { border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); padding: 7px 14px; font-weight: 600; }
.toast { position: fixed; z-index: 90; left: 50%; translate: -50% 0; top: calc(14px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 16px; font-size: 14px; box-shadow: var(--shadow); max-width: min(92vw, 520px); }
.toast.bad { background: var(--danger); color: #fff; }

/* ===== Painel do administrador ===== */
.adm { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
.adm-in { max-width: 980px; margin: 0 auto; padding-bottom: 60px; }
.atop { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
.atop h2 { margin: 0; font: 700 20px var(--font-display); }
.atop .sp { flex: 1; }
.pill { font-size: 12.5px; font-weight: 600; padding: 4px 11px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.pill.dirty { background: var(--promo-soft); color: var(--promo); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 15px; font-weight: 600; font-size: 14px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dng { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 10px; }
.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 12px; }
.tab { flex: none; border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 500; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.panel { display: flex; flex-direction: column; gap: 16px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.sec h3 { margin: 0 0 4px; font: 700 16px var(--font-display); }
.sec > p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--bg); border-radius: 12px; padding: 12px 14px; }
.kpi span { display: block; color: var(--muted); font-size: 12.5px; }
.kpi b { display: block; font: 700 24px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi.warn b { color: var(--promo); }
.todo { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.todo li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.todo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--promo); margin-top: 6px; flex: none; }
.todo .dot.ok { background: var(--wa); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 32px; gap: 10px; align-items: center; font-size: 13.5px; }
.bar i { display: block; height: 10px; border-radius: 999px; background: var(--accent); min-width: 4px; }
.bar em { font-style: normal; font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld input[type="text"], .fld input[type="number"], .fld input[type="date"], .fld input[type="tel"], .fld textarea, .fld select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; color: var(--ink); font-size: 14.5px; }
.fld textarea { min-height: 84px; resize: vertical; }
.fld small { color: var(--muted); font-size: 12px; }
.row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.plist { display: flex; flex-direction: column; }
.prow { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.pth { width: 48px; height: 58px; border-radius: 8px; overflow: hidden; background: var(--soft); }
.pth svg, .pth img { width: 100%; height: 100%; display: block; object-fit: cover; }
.pnm { min-width: 0; }
.pnm b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.pnm span { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.st { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 4px; background: var(--soft); color: var(--muted); }
.st.warn { background: var(--promo-soft); color: var(--promo); }
.st.ok { background: color-mix(in srgb, var(--wa) 18%, transparent); color: var(--wa-text); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.crow { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--bg); display: grid; gap: 10px; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: end; }
.prev { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.prev .pth { width: 64px; height: 78px; }
.err { background: var(--promo-soft); color: var(--promo); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; }

/* ---- Validação e publicação ---- */
function validar(d) {
  var errs = [], codes = {};
  if (!d.store.nome.trim()) errs.push("O nome da loja não pode ficar vazio.");
  var w = String(d.store.whatsapp || "").replace(/\D/g, "");
  if (w && w.length < 12) errs.push("O WhatsApp precisa ter 55, DDD e número (pelo menos 12 dígitos).");
  d.cupons.forEach(function (c, i) {
    if (!c.codigo) errs.push("O cupom " + (i + 1) + " está sem código.");
    else if (codes[c.codigo]) errs.push("O código " + c.codigo + " aparece mais de uma vez.");
    codes[c.codigo] = 1;
    if (!(c.valor > 0)) errs.push("O cupom " + (c.codigo || i + 1) + " precisa de um desconto maior que zero.");
    if (c.tipo === "percentual" && c.valor > 100) errs.push("O cupom " + c.codigo + " passa de 100%.");
  });
  d.anuncios.forEach(function (a, i) {
    if (a.ativo && !a.titulo.trim() && !a.texto.trim() && !a.fotoId) errs.push("O anúncio " + (i + 1) + " está no ar sem título, texto nem imagem.");
    if (a.link && a.link.trim() && !safeUrl(a.link)) errs.push("O link do anúncio " + (i + 1) + " precisa começar com http:// ou https://.");
  });
  return errs;
}
function buildDoc(data) {

    HEAD + '\n<style id="css">' + css + '</style>\n<div id="root"></div>\n<script type="application/json" id="data">' + json + "<\/script>\n<script id=\"app\">" + app + "<\/script>\n</body></html>";
}
async function publicar() {

      var row=productRow(p);
      var r=await sb.from('produtos').upsert(row,{onConflict:'id'});
      if(r.error)throw r.error;
    }
    var oldIds=DATA.produtos.map(function(p){return p.id;});
    var keep=new Set(d.produtos.map(function(p){return p.id;}));
    var removed=oldIds.filter(function(id){return !keep.has(id);});
    if(removed.length){var del=await sb.from('produtos').delete().in('id',removed);if(del.error)throw del.error;}
    for(var c of d.cupons){
      var cr=await sb.from('cupons').upsert({codigo:c.codigo.toUpperCase(),tipo:c.tipo,desconto:c.valor,minimo:c.minimo||0,validade:c.validade||null,ativo:!!c.ativo},{onConflict:'codigo'});
      if(cr.error)throw cr.error;
    }
    var kept=new Set(d.cupons.map(function(c){return c.codigo.toUpperCase();}));
    var removedCodes=DATA.cupons.map(function(c){return c.codigo;}).filter(function(code){return !kept.has(code);});
    if(removedCodes.length){var dc=await sb.from('cupons').delete().in('codigo',removedCodes);if(dc.error)throw dc.error;}
    var conf={id:1,nome_loja:d.store.nome,slogan:d.store.slogan||'',logo_url:photoUrl(d.store.logoId)||null,banner_titulo:d.store.bannerTitulo||'',dados_extras:{store:d.store,categorias:d.categorias,anuncios:d.anuncios}};
    var co=await sb.from('configuracoes').upsert(conf,{onConflict:'id'});if(co.error)throw co.error;
    DATA=clone(d);draft=null;ssDel('mana_draft');
    renderStore();renderAdmin();toast('Alterações salvas no Supabase!');
  }catch(e){toast('Erro ao salvar: '+(e.message||e),true);}
  finally{if($("pubBtn")){ $("pubBtn").disabled=!dirty();$("pubBtn").textContent='Publicar alterações';}}
}

/* ===== Início ===== */
DATA.produtos=[];DATA.cupons=[];renderStore();
(async function boot(){
  $("admBtn").hidden=false;
  $("admBtn").onclick=authUI;
  try {
    if(!window.supabase)throw Error('Biblioteca Supabase indisponível.');
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    assetsApi={upload:uploadImage};
    await checkAdmin();
    await loadRemote();
    sb.auth.onAuthStateChange(function(){setTimeout(function(){checkAdmin().catch(console.error);},0);});
    if(isAdmin){
      var saved=ssGet('mana_draft');
      if(saved){try{var d=JSON.parse(saved);if(JSON.stringify(d)!==JSON.stringify(DATA))A.recover=d;}catch(e){ssDel('mana_draft');}}
    }
  }catch(e){console.error(e);toast('Não foi possível carregar dados do Supabase: '+e.message,true);DATA.produtos=[];DATA.cupons=[];renderStore();}
})();
})();
</script>
